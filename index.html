  <body class="bg-[#FDFBF7] text-[#2D2D2D] antialiased selection:bg-[#8A9A5B] selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        var shown = false;
        function showBootError(title, detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          shown = true;
          var wrap = document.createElement('div');
          wrap.setAttribute('style', 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FDFBF7;color:#2D2D2D;font-family:system-ui,-apple-system,sans-serif;');
          var card = document.createElement('div');
          card.setAttribute('style', 'max-width:480px;width:100%;background:#fff;border:1px solid #E8E2D8;border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,0.06);');
          var h2 = document.createElement('h2');
          h2.setAttribute('style', 'margin:0 0 8px;font-size:20px;color:#2D2D2D;');
          h2.textContent = title;
          var p = document.createElement('p');
          p.setAttribute('style', 'margin:0 0 12px;font-size:13px;line-height:1.5;color:#5F584E;word-break:break-word;');
          p.textContent = detail;
          var btn = document.createElement('button');
          btn.setAttribute('style', 'padding:10px 18px;border:none;border-radius:999px;background:#3F4C27;color:#fff;font-size:12px;font-weight:700;cursor:pointer;');
          btn.textContent = 'Reload Page';
          btn.onclick = function () { location.reload(); };
          card.appendChild(h2);
          card.appendChild(p);
          card.appendChild(btn);
          wrap.appendChild(card);
          root.appendChild(wrap);
        }
        window.addEventListener('error', function (e) {
          var target = e && e.target;
          if (target && target.tagName === 'SCRIPT' && (target.getAttribute('src') || '').indexOf('main.tsx') !== -1) {
            showBootError(
              'Build Step Required for GitHub Pages',
              'GitHub Pages is currently serving raw source files instead of the built app. In your GitHub repo go to Settings → Pages → Build and deployment → Source and choose "GitHub Actions".'
            );
            return;
          }
          if (e && e.message) {
            showBootError('Unable to Load Store', String(e.message));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason) {
            showBootError('Unable to Load Store', String(e.reason.message || e.reason));
          }
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
